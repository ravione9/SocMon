# Production stack: nginx (static UI + /api + /socket.io) → Node API → Mongo + Redis.
#
# 1) Build the SPA (from repo root) — required; an empty or stale client/dist shows old nav/pages:
#      npm run build
#    Or use the helper script (pull + build + recreate containers):
#      npm run deploy:prod
# 2) Set CORS_ORIGIN in .env to the URL users open in the browser (scheme + host + port).
#    After enabling HTTPS in Admin, use https://YOUR_HOST (not http://) or API calls will fail CORS.
# 3) If you still get 403 after building: host paths must be readable/traversable by the container (nginx user ~101).
#      chmod -R a+rX client/dist && chmod a+x . client client/dist
#    SELinux (RHEL/CentOS): append ,Z to the dist volume line (e.g. :ro,Z) or use the baked nginx image below.
# 4) Start full stack:
#      docker compose -f docker-compose.prod.yml up -d --build
#
# 5) After code/backend changes — rebuild API + MCP + nginx only (mongo/redis unchanged).
#      Requires mongo+redis (+guacd) already running; --build picks up server + server-mcp source.
#      docker compose -f docker-compose.prod.yml up -d --build --force-recreate --no-deps server mcp nginx
#
# 6) After UI changes — rebuild the SPA first (step 1), then recreate nginx only:
#      docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps nginx
#
# UI: port 80. The API is only reachable via nginx, not published directly.
#
# Optional — bake the UI into an image instead of ./client/dist:
#   docker build -f docker/nginx/Dockerfile -t netpulse-nginx .
#   Then run that image with the same default.conf, or swap the nginx service to use image: netpulse-nginx
#   without the client/dist volume.

name: netpulse-prod

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: netpulse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # rw: Admin SSL mode overwrites this file via docker exec from the server container
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:rw
      - ./client/dist:/usr/share/nginx/html:ro
      # Shared with server so the SSL route can write certs + nginx config and reload without restart
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - netpulse
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
      args:
        # false fixes npm SELF_SIGNED_CERT_IN_CHAIN when the registry is behind a corp SSL proxy
        NPM_STRICT_SSL: "true"
    container_name: netpulse-prod-server
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CERTS_DIR: /app/certs
      NGINX_CONF_PATH: /app/nginx/default.conf
      NGINX_CONTAINER: netpulse-nginx
      # guacd runs as a sibling container on the internal Docker network.
      # The server talks to it via the service name, not localhost.
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    volumes:
      # rw so the SSL route can write uploaded certs; nginx reads the same volume
      - ./certs:/app/certs:rw
      # rw so Admin SSL can write HTTPS config without docker cp
      - ./docker/nginx/default.conf:/app/nginx/default.conf:rw
      # Docker socket lets the server trigger `nginx -s reload` without restarting
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
    networks:
      - netpulse
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 75s

  # MCP (Model Context Protocol) sidecar — exposes NetPulse data to LLM clients
  # (Claude Desktop, Cursor, n8n, custom agents). Reaches the API container over
  # the internal docker network and is published to users via nginx at /mcp.
  #
  # Auth: MCP clients send the SAME NetPulse JWT they would send to /api/...
  #   Authorization: Bearer <jwt>
  # The MCP server forwards the bearer to /api/agent/meta on session-init so
  # NetPulse validates it via authenticateUserOrAgent. No JWT secret is shared
  # with this container, so revocations and account disables apply immediately.
  #
  # Tool surface auto-grows: each AI_CONTEXT_MODULES entry becomes
  # netpulse_<id>; a 60s reconcile loop adds/removes tools as modules change
  # and fires notifications/tools/list_changed.
  mcp:
    build:
      context: ./server-mcp
      dockerfile: Dockerfile.prod
      args:
        NPM_STRICT_SSL: "true"
    container_name: netpulse-prod-mcp
    expose:
      - "5050"
    environment:
      NODE_ENV: production
      MCP_TRANSPORT: http
      PORT: "5050"
      # Internal service name on the netpulse network — never use a public URL here.
      NETPULSE_API_BASE: http://server:5000
      # Re-poll AI_CONTEXT_MODULES so newly added dashboards appear in MCP
      # clients without a restart. 0 disables; 5s floor enforced in code.
      NETPULSE_MCP_REFRESH_MS: "60000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - netpulse
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5050/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Apache Guacamole RDP bridge. Reached only from the server container over the
  # internal network (GUACD_HOST: guacd) — port 4822 is intentionally NOT published.
  # Pinned tag avoids surprise behaviour changes from :latest pulls in prod.
  guacd:
    # 1.6.0 had a regression where the FreeRDP child segfaults silently after
    # "User joined / VERSION_1_5_0" against certain Windows Server 2019/2022
    # hosts (no error instruction, no display data, opcode trail = "ready" only).
    # 1.5.5 is the most battle-tested release against current Windows builds.
    image: guacamole/guacd:1.5.5
    container_name: netpulse-prod-guacd
    environment:
      # Levels: trace | debug | info | warning | error.
      # Keep at info in prod; flip to debug only when chasing FreeRDP auth/TLS/NLA failures.
      GUACD_LOG_LEVEL: info
    networks:
      - netpulse
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: netpulse-prod-mongo
    volumes:
      - mongo-data-prod:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: netpulse_dev
      MONGO_INITDB_DATABASE: netpulse
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netpulse
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: netpulse-prod-redis
    command: redis-server --requirepass netpulse_dev
    volumes:
      - redis-data-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "netpulse_dev", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - netpulse
    restart: unless-stopped

volumes:
  mongo-data-prod:
  redis-data-prod:

networks:
  netpulse:
    driver: bridge
