name: netpulse-dev

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # false fixes npm "Exit handler never called" when registry hits SELF_SIGNED_CERT_IN_CHAIN (corp proxy).
        NPM_STRICT_SSL: "false"
    container_name: netpulse-client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      # Isolated from the bind mount: install deps inside the container when package.json changes.
      - /app/node_modules
    # Ensures node_modules (in the volume above) matches mounted package.json / lockfile after git pull.
    command: sh -c "npm config get strict-ssl | grep -q false || npm config set strict-ssl false; npm install --no-audit --no-fund --progress=false && npm run dev"
    environment:
      NODE_ENV: development
      # Proxy /api and /socket.io inside the compose network (browser must NOT call 127.0.0.1 — that
      # targets each client machine and breaks when you open the UI via LAN IP or another hostname).
      VITE_DEV_PROXY_TARGET: http://server:5000
      VITE_API_URL: ""
      VITE_WS_URL: ""
    depends_on:
      - server
    networks:
      - netpulse
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        NPM_STRICT_SSL: "false"
    container_name: netpulse-server
    ports:
      - "5000:5000"
      - "9229:9229"
    volumes:
      - ./server:/app
      # Isolated from the bind mount: install deps inside the container when package.json changes.
      - /app/node_modules
      # rw so the SSL route can write uploaded certs; nginx reads the same volume
      - ./certs:/app/certs:rw
      # Docker socket lets the server trigger `nginx -s reload` without restarting the container
      - /var/run/docker.sock:/var/run/docker.sock
    # Sync node_modules (in the volume above) with mounted package.json/lockfile, then start.
    command: sh -c "npm config get strict-ssl | grep -q false || npm config set strict-ssl false; npm install --no-audit --no-fund --progress=false && npm run dev"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      TZ: Asia/Kolkata
      # guacd runs as a sibling container on the internal Docker network.
      # The server talks to it via the service name, not localhost.
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
    networks:
      - netpulse
    restart: unless-stopped

  # Apache Guacamole RDP bridge — logs speak TCP-level lifecycle only unless FreeRDP errors surface here.
  # Interpretation:
  #   • Two adjacent "Creating new client" before removals → two parallel sessions (two browser tabs,
  #     dev StrictMode race, or quick reconnect while the prior WS still spins up).
  #   • Repeated banner "Guacamole proxy daemon … started" → guacd container restarted (crash/OOM,
  #     compose recreate); kills every active RDP session from Netpulse.
  # Prefer a pinned tag so pulls don't silently change behaviour (avoid :latest in prod stacks).
  guacd:
    # 1.6.0 had a regression where the FreeRDP child segfaults silently after
    # "User joined / VERSION_1_5_0" against certain Windows Server 2019/2022
    # hosts (no error instruction, no display data, opcode trail = "ready" only).
    # 1.5.5 is the most battle-tested release against current Windows builds.
    image: guacamole/guacd:1.5.5
    container_name: netpulse-guacd
    # Port 4822 is only needed if you want to reach guacd from outside Docker.
    # The server container reaches it via the internal network (GUACD_HOST: guacd).
    # Uncomment the line below only for debugging:
    # ports:
    #   - "4822:4822"
    environment:
      # debug surfaces FreeRDP auth/TLS/NLA failures (default = info hides them).
      # Levels: trace | debug | info | warning | error.
      GUACD_LOG_LEVEL: debug
    networks:
      - netpulse
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: netpulse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: netpulse_dev
      MONGO_INITDB_DATABASE: netpulse
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netpulse
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: netpulse-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass netpulse_dev
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "netpulse_dev", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - netpulse
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:

networks:
  netpulse:
    driver: bridge
