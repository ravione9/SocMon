events { worker_connections 1024; }
http {
  upstream api    { server server:5000; }
  upstream client { server client:80;   }

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/netpulse.crt;
    ssl_certificate_key /etc/nginx/certs/netpulse.key;

    # Browser RDP (Apache Guacamole) — long-lived WebSocket via guacd.
    # Must be declared BEFORE /api/ so Upgrade headers and buffering=off apply.
    # Without this block, the WS handshake passes through /api/ which lacks
    # the Upgrade headers, and the browser sees code 1006 / "tunnel closed".
    location = /api/rdp/ws {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_buffering off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # Device Web UI proxy (FortiGate / Cisco): mixed HTTP + WS upgrades from
    # device admin pages. Disable buffering so streamed device responses pass
    # through, and lengthen timeouts to support long admin sessions.
    location /api/web-mgmt/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    location / {
      proxy_pass http://client;
    }
  }
}
